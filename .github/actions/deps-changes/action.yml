name: Dependency manifest changes
description: >
  Runs dorny/paths-filter to detect whether any dependency-manifest file changed, replacing the
  `changes` job body duplicated across mecha-industries repos' security.yml files. The default
  `filters` input is the broad polyglot list (package.json/yarn.lock/pnpm-lock.yaml, Cargo.toml/
  Cargo.lock, requirements*.txt/pyproject.toml, Gemfile/Gemfile.lock, go.mod/go.sum) from
  mecha10-rl's job; it is a strict superset of mecha10-nodes' Rust-only list, so Rust-only repos
  get identical behavior from the default (no non-Rust manifests exist there to match) and don't
  need to pass anything. Pass `filters` to narrow or otherwise customize the list. For monorepos
  (e.g. a Rust workspace with many crates), pass a `filters` block with one key per package, such
  as `crate-a: ['crates/crate-a/**/Cargo.toml']` and `crate-b: ['crates/crate-b/**/Cargo.toml']`,
  then gate a matrix or a per-package job on the new `changes` output, e.g.
  `if: contains(fromJSON(needs.changes.outputs.changes), 'crate-a')`. Job-level concerns can't
  live in a composite action: the caller's `changes` job must still declare its own
  `if: github.event_name != 'schedule'`, `runs-on:`, `permissions: { contents: read,
  pull-requests: read }` (pull-requests: read is required by paths-filter on pull_request events),
  and an `outputs:` mapping that re-exports this action's `deps` output and, for monorepo callers,
  its `changes` output.

inputs:
  filters:
    description: >
      paths-filter `filters:` YAML block. Defaults to the broad polyglot dependency-manifest list;
      override to narrow or extend it.
    required: false
    default: |
      deps:
        - '**/package.json'
        - '**/yarn.lock'
        - '**/pnpm-lock.yaml'
        - '**/Cargo.toml'
        - '**/Cargo.lock'
        - '**/requirements*.txt'
        - '**/pyproject.toml'
        - '**/Gemfile'
        - '**/Gemfile.lock'
        - '**/go.mod'
        - '**/go.sum'

outputs:
  deps:
    description: Whether any dependency manifest matched the filters.
    value: ${{ steps.filter.outputs.deps }}
  changes:
    description: >
      JSON array of the `filters` keys that matched (dorny/paths-filter's `changes` output,
      passed through unchanged). For a monorepo `filters` block with one key per package/crate
      (e.g. `crate-a`, `crate-b`), a caller indexes this per package instead of relying on the
      single repo-wide `deps` boolean, e.g.
      `if: contains(fromJSON(needs.changes.outputs.changes), 'crate-a')` to gate a per-package job,
      or iterate it as a matrix via `fromJSON(needs.changes.outputs.changes)`.
    value: ${{ steps.filter.outputs.changes }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: ${{ inputs.filters }}
