name: Setup Python and uv
description: >
  Installs and caches Python and uv, with the astral-sh/setup-uv main-branch cache fallback.
  Hoisted from mecha-industries/mecha10's local .github/actions/setup-python-uv action. Like
  this repo's setup-rust action, this action does NOT run actions/checkout itself - it expects
  to run mid-job after the calling job has already checked out the repository.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.12'
  cache-prefix:
    description: Cache key prefix for astral-sh/setup-uv (use "main" for the main branch).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
