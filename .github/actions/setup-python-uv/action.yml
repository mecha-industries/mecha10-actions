name: Setup Python and uv
description: >
  Installs and caches Python and uv. Hoisted from mecha-industries/mecha10's local
  .github/actions/setup-python-uv action. Like this repo's setup-rust action, this action does
  NOT run actions/checkout itself - it expects to run mid-job after the calling job has already
  checked out the repository.

  uv is installed via astral.sh's official standalone installer with UV_INSTALL_DIR pinned to a
  path under $RUNNER_TEMP, NOT via astral-sh/setup-uv. On rootless ARC runners,
  astral-sh/setup-uv (through @actions/tool-cache's cacheDir) installs to a path derived from
  RUNNER_TOOL_CACHE, but that env var is read at a point that still resolves to the image-baked,
  read-only /opt/hostedtoolcache even when a step earlier in this same composite action
  overrides RUNNER_TOOL_CACHE via GITHUB_ENV - see mecha10-actions PR for the live rerun that
  proved this (RUNNER_TOOL_CACHE correctly showed the redirected path in the step env, and the
  very next step still hit `EACCES: permission denied, mkdir '/opt/hostedtoolcache/uv'`). The
  standalone installer has no such indirection: UV_INSTALL_DIR is read directly by install.sh and
  controls exactly where the `uv`/`uvx` binaries land, with no tool-cache involvement at all.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.12'
  cache-prefix:
    description: >
      Cache key disambiguator for the uv dependency cache (use "main" for the main branch).
      Used as part of the actions/cache key for uv's own download/build cache directory. Leave
      unset/empty to use a cache key with no extra disambiguator.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Redirect tool cache to a writable path
      shell: bash
      run: |
        set -euo pipefail
        tool_cache_dir="${RUNNER_TEMP}/hostedtoolcache"
        mkdir -p "${tool_cache_dir}"
        echo "RUNNER_TOOL_CACHE=${tool_cache_dir}" >> "${GITHUB_ENV}"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore uv cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: >-
          uv-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.cache-prefix }}-${{
          hashFiles('**/uv.lock', '**/pyproject.toml') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.cache-prefix }}-

    - name: Install uv
      shell: bash
      env:
        UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
        UV_NO_MODIFY_PATH: '1'
      run: |
        set -euo pipefail
        mkdir -p "${UV_INSTALL_DIR}"
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "${UV_INSTALL_DIR}" >> "${GITHUB_PATH}"
        "${UV_INSTALL_DIR}/uv" --version
