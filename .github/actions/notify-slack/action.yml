name: Notify Slack
description: >
  Posts one grouped Slack message summarizing every unit released in a run (unit name,
  version, and release-notes URL). Ships its own reconciled copy of
  notify-release-slack.sh - the script that used to be duplicated per repo across
  mecha10-api, mecha10-nodes, mecha10-rl, mecha10-dashboard, mecha10-deploy, and
  mecha10-assets - at scripts/notify-release-slack.sh inside this action's own directory,
  and invokes it directly off disk via GITHUB_ACTION_PATH by default. The caller still owns
  the job-level `needs:`/`if:` gating and builds units-json from its own release job's
  outputs - a composite action cannot contribute to another job's `needs:` graph. This
  action does NOT run actions/checkout for the default (bundled-script) path: posting a
  Slack message needs no file from the caller's repository tree. A caller that overrides
  script-path to point at a path inside its own checkout must run actions/checkout itself
  before this action in the same job.

inputs:
  units-json:
    description: >
      JSON array of {unit, version, release_url} objects, one per unit released this run.
      An empty array ([]) is a valid, expected input for "nothing released this run" - the
      action exits without posting instead of sending a confusing empty message.
    required: true
  slack-bot-token:
    description: >
      Slack bot token for chat.postMessage; the caller passes its secrets.SLACK_BOT_TOKEN.
      Empty is treated as "notifications not configured for this run" (e.g. a fork PR with
      no repo secrets) and skips with a log line, not a failure - matching every one of the
      six source scripts' existing behavior for this exact case.
    required: false
    default: ""
  slack-channel:
    description: >
      Slack channel ID or name to post to; the caller passes whichever secret or repo
      variable it stores its release channel under. Falls back to the literal #release
      when empty.
    required: false
    default: ""
  slack-api-url:
    description: Override for the Slack chat.postMessage endpoint, for testing.
    required: false
    default: "https://slack.com/api/chat.postMessage"
  script-path:
    description: >
      Escape hatch for a repo with a genuinely bespoke variant of the notification script.
      Path (relative to the caller's own checkout) to a script to run instead of this
      action's bundled scripts/notify-release-slack.sh. Leave empty (the default) to use
      the bundled script - that is the right choice for every repo that has not
      deliberately diverged.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Notify Slack of release units
      shell: bash
      env:
        UNITS_JSON: ${{ inputs.units-json }}
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        SLACK_RELEASE_CHANNEL_ID: ${{ inputs.slack-channel }}
        SLACK_API_URL: ${{ inputs.slack-api-url }}
        SCRIPT_PATH: ${{ inputs.script-path }}
        BUNDLED_SCRIPT: ${{ github.action_path }}/scripts/notify-release-slack.sh
      run: |
        set -euo pipefail

        if ! echo "$UNITS_JSON" | jq -e . >/dev/null 2>&1; then
          echo "::error::units-json is not valid JSON: $UNITS_JSON"
          exit 1
        fi

        script="${SCRIPT_PATH:-$BUNDLED_SCRIPT}"
        chmod +x "$script"

        echo "$UNITS_JSON" | "$script" -
