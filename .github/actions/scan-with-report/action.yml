name: Scan with sticky-comment report
description: >
  Shared body for a repo's PR-time scan jobs (e.g. design-system, dead-code,
  duplicate-code, react-tech-debt, max-lines): run a yarn script that writes
  a markdown report, post/update a sticky PR comment with that report (via
  danger-js's `danger ci --id`, keyed on sticky-header so each calling job
  keeps its own independent comment) regardless of outcome, expose that
  report plus the scan's pass/fail outcome (and any <report>-groups.json
  it wrote) as this action's outputs, then fail the containing job if the
  script failed and blocking is true. Hoisted from
  mecha-industries/mecha10-dashboard's local action of the same name.
  Callers must run their own node/yarn setup step first — this action does
  not restore deps itself — and this action deliberately does not check
  out the repository either, since the calling job must already have done
  so to have deps/build output present (some jobs also need e.g.
  permissions: pull-requests: write set on the job, which a composite
  action can't set for its caller).

  Filing a Linear ticket on failure is centralized in a single
  file-linear-tickets job in the caller's own workflow rather than one
  ticket-filing step per calling job. This action only produces the raw
  material (outcome, report, groups) that job consumes.

inputs:
  script:
    description: yarn script to run, e.g. design-system, dead-code.
    required: true
  working-directory:
    description: >
      Directory (relative to the repo root) the app lives in. Defaults to
      . (repo root). Applied to the yarn <script> step below; scan
      scripts write their report relative to their own cwd, so callers
      must pass a report-file that already accounts for this.
    required: false
    default: '.'
  report-file:
    description: Path to the markdown report the script writes, e.g. a11y-report.md.
    required: true
  sticky-header:
    description: >
      Unique id for the danger-js sticky PR comment (passed as
      danger ci --id), e.g. design-system-scan. Keeps this job's comment
      independent of every other calling job's comment on the same PR, and
      lets re-runs update it in place instead of piling up new comments.
    required: true
  gh-token:
    description: >
      Optional secret (e.g. secrets.GH_PAT) forwarded as GH_TOKEN/
      GITHUB_TOKEN to the yarn <script> step below — only needed if a
      script transitively needs gh CLI/GitHub REST access. Empty string
      is a no-op. Callers must still restore deps with this same token on
      their own setup step first — this input only covers the scan
      script's own run.
    required: false
    default: ''
  blocking:
    description: >
      Whether a scan failure fails the containing job. Defaults to true.
      Set to false for report-only/advisory scans that should keep
      scanning, posting the sticky comment, and filing a Linear ticket on
      failure, but never block auto-merge.
    required: false
    default: 'true'

outputs:
  outcome:
    description: success or failure — the scan step's own outcome.
    value: ${{ steps.scan.outcome }}
  report:
    description: Contents of report-file (or a placeholder if it wasn't written).
    value: ${{ steps.report.outputs.report }}
  groups:
    description: >
      Contents of the scan's <script>-groups.json (derived from
      report-file by replacing its -report.md suffix with
      -groups.json — the convention every scan script's
      writeGroupsFile call already writes to), or [] if the script
      never wrote one. Consumed by a caller's grouped-mode ticket filing.
    value: ${{ steps.report.outputs.groups }}

runs:
  using: composite
  steps:
    - run: yarn ${{ inputs.script }}
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        GITHUB_TOKEN: ${{ inputs.gh-token }}

    - name: Post sticky PR comment via danger-js
      if: always()
      shell: bash
      env:
        DANGER_GITHUB_API_TOKEN: ${{ inputs.gh-token != '' && inputs.gh-token || github.token }}
        DANGER_REPORT_FILE: ${{ inputs.report-file }}
      run: npx --yes danger@14 ci --id "${{ inputs.sticky-header }}" --dangerfile "${{ github.action_path }}/dangerfile-template.js"

    - name: Capture report
      id: report
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        {
          echo "report<<SCAN_WITH_REPORT_EOF"
          if [ -f "${{ inputs.report-file }}" ]; then
            cat "${{ inputs.report-file }}"
            echo
          else
            echo "(no report written — see the ${{ inputs.script }} job's own log)"
          fi
          echo "SCAN_WITH_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

        groups_file="$(printf '%s' "${{ inputs.report-file }}" | sed 's/-report\.md$/-groups.json/')"
        {
          echo "groups<<SCAN_WITH_REPORT_GROUPS_EOF"
          if [ -f "$groups_file" ]; then
            cat "$groups_file"
            echo
          else
            echo "[]"
          fi
          echo "SCAN_WITH_REPORT_GROUPS_EOF"
        } >> "$GITHUB_OUTPUT"

    - if: steps.scan.outcome == 'failure' && inputs.blocking == 'true'
      shell: bash
      run: exit 1
