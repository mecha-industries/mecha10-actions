name: Commit and push writeback
description: >
  Stages the given paths, commits them, and pushes the commit directly to the repo's
  default branch, retrying on push rejection (a parallel PR merge, a version-bump push,
  etc. landing on that branch between checkout and push) up to `max-retries` times.
  Centralizes the writeback mechanics duplicated across the `update-status-table` jobs in
  mecha10-api, mecha10-dashboard, and mecha10-rl. This action deliberately does NOT run
  actions/checkout - like this repo's trivy-scan, setup-rust, rust-fmt, and rust-clippy
  actions, it runs mid-job after the calling job has already checked out the repository
  with the PAT (not GITHUB_TOKEN, so the resulting remote is push-authenticated) and
  `fetch-depth: 0` (so retries can resync against full history), and generated the content
  to be committed - a second checkout here would clobber whatever the caller's generation
  step already produced in the workspace. The files named in `paths` must already be
  modified in the workspace by the time this action runs.

  Two retry modes, chosen via `retry-mode`. `rebase` (the default, unchanged behaviour):
  on push rejection, fetch and rebase the existing writeback commit onto the new remote
  head, replaying the diff; a rebase conflict (someone else editing the same generated
  section) fails the step loudly instead of silently discarding either side. `regenerate`:
  on push rejection, drop the stale writeback commit, resync to the new remote head,
  re-run the caller-supplied `regenerate-command` from scratch against that new base, and
  re-commit only if the regenerated output still differs - avoiding a spurious rebase
  conflict from an unrelated concurrent edit near the generated content. Never
  force-pushes and never hard-resets over the remote branch itself (only over this
  action's own prior local commit). What stays out of scope, and must stay in the caller:
  the content generation itself (what changed and which script built it), the checkout,
  and the job-level `needs:`, `concurrency:`, `permissions: contents: write`, and `if:`
  skip guard - a composite action cannot contribute to another job's `needs:` graph or
  declare job-level `if:`/`concurrency:`/`permissions:`, so the calling job must keep
  declaring all of those, including an `if:` that skips runs whose own commit message
  matches `commit-message` below (so this job's writeback commit doesn't retrigger itself).

inputs:
  gh-pat:
    description: >
      A PAT (not GITHUB_TOKEN) with Contents: read/write on this repo; the caller passes its
      secrets.GH_PAT. GITHUB_TOKEN cannot push straight past branch protection,
      so a composite action step fails loudly here instead of checkout silently falling back
      to GITHUB_TOKEN or failing with an opaque auth error.
    required: true
  paths:
    description: Newline- or space-separated file path(s) to stage and commit.
    required: true
  commit-message:
    description: Commit message for the writeback commit.
    required: true
  target-branch:
    description: Branch to push the writeback commit to.
    required: false
    default: "main"
  max-retries:
    description: Number of push attempts before failing the step.
    required: false
    default: "3"
  retry-mode:
    description: >
      Push-rejection retry strategy: "rebase" (default - fetch and rebase the existing
      writeback commit onto the new remote head) or "regenerate" (drop the stale commit,
      resync, re-run regenerate-command, and re-commit only if still different).
    required: false
    default: "rebase"
  regenerate-command:
    description: >
      Shell command to re-run the content generation from scratch against the resynced
      base. Required when retry-mode is "regenerate"; ignored otherwise.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify gh-pat is configured
      shell: bash
      env:
        GH_PAT: ${{ inputs.gh-pat }}
      run: |
        if [ -z "$GH_PAT" ]; then
          echo "::error::gh-pat input is empty. This action pushes directly to a protected branch and requires a real PAT (not GITHUB_TOKEN) - pass secrets.GH_PAT (a PAT with at least Contents: read/write) from the calling repo."
          exit 1
        fi

    - name: Verify regenerate-command is configured for regenerate mode
      shell: bash
      env:
        WRITEBACK_RETRY_MODE: ${{ inputs.retry-mode }}
        WRITEBACK_REGENERATE_COMMAND: ${{ inputs.regenerate-command }}
      run: |
        if [ "$WRITEBACK_RETRY_MODE" = "regenerate" ] && [ -z "$WRITEBACK_REGENERATE_COMMAND" ]; then
          echo "::error::retry-mode is 'regenerate' but regenerate-command is empty. Pass the shell command that regenerates the committed paths from scratch, or switch retry-mode back to 'rebase'."
          exit 1
        fi

    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "GitHub Actions"

    - name: Commit and push with retry
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-pat }}
        WRITEBACK_PATHS: ${{ inputs.paths }}
        WRITEBACK_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        WRITEBACK_TARGET_BRANCH: ${{ inputs.target-branch }}
        WRITEBACK_MAX_RETRIES: ${{ inputs.max-retries }}
        WRITEBACK_RETRY_MODE: ${{ inputs.retry-mode }}
        WRITEBACK_REGENERATE_COMMAND: ${{ inputs.regenerate-command }}
      run: |
        set -euo pipefail

        git add -- $WRITEBACK_PATHS

        if git diff --cached --quiet; then
          echo "No change to commit, nothing to push"
          exit 0
        fi

        git commit -m "$WRITEBACK_COMMIT_MESSAGE"

        attempt=1
        until git push origin "HEAD:${WRITEBACK_TARGET_BRANCH}"; do
          if [ "$attempt" -ge "$WRITEBACK_MAX_RETRIES" ]; then
            echo "::error::Failed to push writeback commit to ${WRITEBACK_TARGET_BRANCH} after ${WRITEBACK_MAX_RETRIES} attempts"
            exit 1
          fi

          echo "Push rejected (most likely a concurrent commit landed on ${WRITEBACK_TARGET_BRANCH}) - resyncing and retrying (attempt $((attempt + 1))/${WRITEBACK_MAX_RETRIES})"
          attempt=$((attempt + 1))
          sleep 5

          git fetch origin "$WRITEBACK_TARGET_BRANCH"

          if [ "$WRITEBACK_RETRY_MODE" = "regenerate" ]; then
            git reset --hard "origin/${WRITEBACK_TARGET_BRANCH}"

            eval "$WRITEBACK_REGENERATE_COMMAND"

            git add -- $WRITEBACK_PATHS

            if git diff --cached --quiet; then
              echo "Regenerated output matches the new base, nothing to push"
              exit 0
            fi

            git commit -m "$WRITEBACK_COMMIT_MESSAGE"
          else
            git rebase "origin/${WRITEBACK_TARGET_BRANCH}"
          fi
        done
