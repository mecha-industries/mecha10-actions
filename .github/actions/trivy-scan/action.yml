name: Trivy scan
description: >
  Runs an Aqua Trivy scan (vulnerability or secret mode) against the checked-out repo.
  Replaces the apt-get install curl/ca-certificates + aquasecurity/trivy-action steps
  duplicated verbatim across mecha-industries repos' security.yml/pr.yml files. Intended
  to run inside a job with `container: image: ubuntu:22.04` (or any image lacking curl).

inputs:
  scanners:
    description: Trivy scanner(s) to run - "vuln" or "secret".
    required: true
  severity:
    description: Comma-separated severity levels to fail on.
    required: false
    default: "HIGH,CRITICAL"
  scan-ref:
    description: Path to scan.
    required: false
    default: "."
  trivy-action-version:
    description: Pinned aquasecurity/trivy-action version.
    required: false
    default: "v0.36.0"
  resilient-install:
    description: >
      If "true", download the Trivy binary directly from GitHub's releases/download CDN
      with a retry loop instead of letting trivy-action's own setup-trivy installer run.
      Works around setup-trivy's flaky version-lookup call under load.
    required: false
    default: "false"
  trivy-version:
    description: Trivy version to install when resilient-install is "true" (e.g. v0.76.2).
    required: false
    default: "v0.76.2"
  db-repository:
    description: Optional override for TRIVY_DB_REPOSITORY (e.g. ghcr.io/aquasecurity/trivy-db:2).
    required: false
    default: ""
  java-db-repository:
    description: Optional override for TRIVY_JAVA_DB_REPOSITORY.
    required: false
    default: ""
  cache-db:
    description: >
      When "true", wraps the Trivy step with a date-keyed actions/cache (write) or
      actions/cache/restore (read-only) step against .cache/trivy, and passes
      `cache: false` + `cache-dir: .cache/trivy` to trivy-action so this composite action
      manages the DB cache itself instead of trivy-action's own default caching.
      Default "false" - today's behavior, unaffected for every existing caller.
    required: false
    default: "false"
  cache-write:
    description: >
      Only used when cache-db is "true". Whether this run may write a new cache entry ("true")
      or only read an existing one via restore-keys ("false") - only one trigger (conventionally
      push-to-main) should write a given day's DB so others don't race to create their own
      multi-hundred-MB entry. Default "false" (read-only).
    required: false
    default: "false"
  direct-binary:
    description: >
      When "true", run the downloaded Trivy binary directly from a shell step instead of
      delegating to aquasecurity/trivy-action. trivy-action is a Docker-container action, so it
      requires a Docker CLI on the runner host; the direct path does not, which lets a caller run
      this action on a minimal runner image with no `container:` block. Implies the same binary
      download that resilient-install performs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install curl (needed by trivy-action's own installer)
      shell: bash
      run: |
        set -o pipefail
        PACKAGES=""
        command -v curl >/dev/null 2>&1 || PACKAGES="$PACKAGES curl ca-certificates"
        if [ "${{ inputs.resilient-install }}" == "true" ] || [ "${{ inputs.direct-binary }}" == "true" ]; then
          command -v tar >/dev/null 2>&1 || PACKAGES="$PACKAGES tar"
        fi
        if [ -z "$PACKAGES" ]; then
          exit 0
        fi
        if [ "$(id -u)" -eq 0 ]; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends $PACKAGES
        elif command -v sudo >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PACKAGES
        else
          echo "::error::Missing required packages ($PACKAGES) and no sudo available to install them" >&2
          exit 1
        fi

    - name: Install Trivy binary (resilient)
      if: inputs.resilient-install == 'true' || inputs.direct-binary == 'true'
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        set -e
        BIN_DIR="$HOME/.local/bin/trivy-bin"
        mkdir -p "$BIN_DIR"
        VER_NUM="${TRIVY_VERSION#v}"
        URL="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${VER_NUM}_Linux-64bit.tar.gz"
        for i in 1 2 3 4 5; do
          if curl -fsSL "$URL" -o /tmp/trivy.tar.gz; then
            tar -xzf /tmp/trivy.tar.gz -C "$BIN_DIR" trivy
            echo "Installed Trivy ${TRIVY_VERSION} on attempt $i"
            break
          fi
          echo "Trivy download attempt $i failed, retrying in $((i * 5))s..." >&2
          [ "$i" -eq 5 ] && { echo "::error::Trivy install failed after 5 attempts" >&2; exit 1; }
          sleep $((i * 5))
        done
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    - name: Set Trivy DB repository overrides
      if: inputs.db-repository != '' || inputs.java-db-repository != ''
      shell: bash
      run: |
        if [ -n "${{ inputs.db-repository }}" ]; then
          echo "TRIVY_DB_REPOSITORY=${{ inputs.db-repository }}" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.java-db-repository }}" ]; then
          echo "TRIVY_JAVA_DB_REPOSITORY=${{ inputs.java-db-repository }}" >> "$GITHUB_ENV"
        fi

    - name: Compute Trivy DB cache date
      if: inputs.cache-db == 'true'
      id: trivy-date
      shell: bash
      run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Cache Trivy DB
      if: inputs.cache-db == 'true' && inputs.cache-write == 'true'
      uses: actions/cache@v4
      with:
        path: .cache/trivy
        key: trivy-db-${{ steps.trivy-date.outputs.date }}
        restore-keys: |
          trivy-db-

    - name: Restore Trivy DB (read-only)
      if: inputs.cache-db == 'true' && inputs.cache-write != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .cache/trivy
        key: trivy-db-${{ steps.trivy-date.outputs.date }}
        restore-keys: |
          trivy-db-

    - name: Run Trivy
      if: inputs.cache-db != 'true' && inputs.direct-binary != 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        skip-setup-trivy: ${{ inputs.resilient-install }}
        scan-type: fs
        scan-ref: ${{ inputs.scan-ref }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        exit-code: "1"
        format: table

    - name: Run Trivy (with DB cache)
      if: inputs.cache-db == 'true' && inputs.direct-binary != 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        skip-setup-trivy: ${{ inputs.resilient-install }}
        scan-type: fs
        scan-ref: ${{ inputs.scan-ref }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        exit-code: "1"
        format: table
        cache: false
        cache-dir: .cache/trivy

    - name: Run Trivy (direct binary)
      if: inputs.direct-binary == 'true'
      shell: bash
      run: |
        set -o pipefail
        args=(fs --scanners "${{ inputs.scanners }}" --severity "${{ inputs.severity }}" --exit-code 1 --format table)
        if [ "${{ inputs.cache-db }}" == "true" ]; then
          mkdir -p .cache/trivy
          args+=(--cache-dir .cache/trivy)
        fi
        trivy "${args[@]}" "${{ inputs.scan-ref }}"
