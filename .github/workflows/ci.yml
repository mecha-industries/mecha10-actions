name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        shell: bash
        run: |
          set -o pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  shell-script-tests:
    name: shell script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run notify-slack script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/notify-slack/scripts/notify-release-slack.test.sh
          .github/actions/notify-slack/scripts/notify-release-slack.test.sh
      - name: Run ci-failure-ticket script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/ci-failure-ticket/scripts/file-ci-failure-ticket.test.sh
          .github/actions/ci-failure-ticket/scripts/file-ci-failure-ticket.test.sh
      - name: Run rust-coverage sccache script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/rust-coverage/scripts/setup-sccache-cache-mode.test.sh
          .github/actions/rust-coverage/scripts/setup-sccache-cache-mode.test.sh
          chmod +x .github/actions/rust-coverage/scripts/cargo-with-sccache-fallback.test.sh
          .github/actions/rust-coverage/scripts/cargo-with-sccache-fallback.test.sh
      - name: Run rust-clippy sccache script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/rust-clippy/scripts/cargo-with-sccache-fallback.test.sh
          .github/actions/rust-clippy/scripts/cargo-with-sccache-fallback.test.sh
