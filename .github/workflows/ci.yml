name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  actionlint:
    name: actionlint
    runs-on: arc-catfood-minimal
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        shell: bash
        run: |
          set -o pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  shell-script-tests:
    name: shell script tests
    runs-on: arc-catfood-minimal
    steps:
      - uses: actions/checkout@v7
      - name: Run notify-slack script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/notify-slack/scripts/notify-release-slack.test.sh
          .github/actions/notify-slack/scripts/notify-release-slack.test.sh
      - name: Run ci-failure-ticket script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/ci-failure-ticket/scripts/file-ci-failure-ticket.test.sh
          .github/actions/ci-failure-ticket/scripts/file-ci-failure-ticket.test.sh
      - name: Run rust-coverage sccache script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/rust-coverage-scripts/setup-sccache-cache-mode.test.sh
          .github/actions/rust-coverage-scripts/setup-sccache-cache-mode.test.sh
          chmod +x .github/actions/rust-coverage-scripts/cargo-with-sccache-fallback.test.sh
          .github/actions/rust-coverage-scripts/cargo-with-sccache-fallback.test.sh
      - name: Run rust-clippy sccache script tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/actions/rust-clippy/scripts/cargo-with-sccache-fallback.test.sh
          .github/actions/rust-clippy/scripts/cargo-with-sccache-fallback.test.sh

  rust-coverage-smoke-collect-report:
    # Exercises the "collect" + "report" coverage roles end-to-end against a tiny throwaway
    # crate (.github/smoke-fixtures/rust-coverage) - two nextest-sharded collect calls followed
    # by a report call that merges their profile data into one lcov.info. These two actions had
    # never run in CI before this job; see rust-coverage-collect/action.yml and
    # rust-coverage-report/action.yml for why they exist.
    name: rust-coverage smoke test (collect + report)
    runs-on: arc-catfood-minimal
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Collect shard 1/2
        uses: ./.github/actions/rust-coverage-collect
        with:
          working-directory: .github/smoke-fixtures/rust-coverage
          crate-scope: workspace
          runner: nextest
          partition: count:1/2
          all-features: true
          report-filename: test-report-1.txt

      - name: Collect shard 2/2
        uses: ./.github/actions/rust-coverage-collect
        with:
          working-directory: .github/smoke-fixtures/rust-coverage
          crate-scope: workspace
          runner: nextest
          partition: count:2/2
          all-features: true
          report-filename: test-report-2.txt

      - name: Report
        uses: ./.github/actions/rust-coverage-report
        with:
          working-directory: .github/smoke-fixtures/rust-coverage
          output-path: lcov.info

      - name: Verify report output
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/smoke-fixtures/rust-coverage/lcov.info
          test -s .github/smoke-fixtures/rust-coverage/coverage-report.txt
          echo "collect + report smoke test produced a non-empty lcov.info and coverage-report.txt"

  rust-coverage-smoke-run:
    # Exercises the "run" coverage role (single-shot, no sharding) against the same throwaway
    # crate, using the default libtest runner specifically - the other job above already
    # exercises nextest, so between the two jobs both `runner` values actually execute in CI.
    # This action had never run in CI before this job; see rust-coverage-run/action.yml.
    name: rust-coverage smoke test (run)
    runs-on: arc-catfood-minimal
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Run
        uses: ./.github/actions/rust-coverage-run
        with:
          working-directory: .github/smoke-fixtures/rust-coverage
          crate-scope: workspace
          runner: libtest
          all-features: true

      - name: Verify run output
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/smoke-fixtures/rust-coverage/lcov.info
          test -s .github/smoke-fixtures/rust-coverage/coverage-report.txt
          echo "run smoke test produced a non-empty lcov.info and coverage-report.txt"

  setup-sccache-cache-mode-smoke:
    # Exercises the new setup-sccache-cache-mode action directly (not from inside
    # rust-coverage-run/collect/report) - the whole point of this action is to let a plain
    # workflow step reach scripts/ci's bundled setup-sccache-cache-mode.sh by `uses:`, so this
    # job has to call it the same way a migrated consumer repo eventually would.
    name: setup-sccache-cache-mode action smoke test
    runs-on: arc-catfood-minimal
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create a fake persistent mount
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/fake-sccache-mount"

      - name: Configure sccache cache mode
        uses: ./.github/actions/setup-sccache-cache-mode
        with:
          persistent-mount: ${{ runner.temp }}/fake-sccache-mount

      - name: Verify SCCACHE_DIR/SCCACHE_CACHE_SIZE were exported
        shell: bash
        run: |
          set -euo pipefail
          # $GITHUB_ENV is a per-step file - the runner applies what the previous step wrote to
          # it to THIS step's environment, then starts this step with a fresh (empty) file. So
          # the exported values must be checked via $SCCACHE_CACHE_SIZE/$SCCACHE_DIR here, not by
          # grepping $GITHUB_ENV again.
          if [[ "${SCCACHE_CACHE_SIZE:-}" != "8G" ]]; then
            echo "expected SCCACHE_CACHE_SIZE=8G, got '${SCCACHE_CACHE_SIZE:-<unset>}'" >&2
            exit 1
          fi
          expected_dir_prefix="${RUNNER_TEMP}/fake-sccache-mount/sccache-"
          if [[ "${SCCACHE_DIR:-}" != "${expected_dir_prefix}"* ]]; then
            echo "expected SCCACHE_DIR to start with '${expected_dir_prefix}', got '${SCCACHE_DIR:-<unset>}'" >&2
            exit 1
          fi
          echo "setup-sccache-cache-mode action exported the expected SCCACHE_CACHE_SIZE/SCCACHE_DIR"

  run-cargo-with-sccache-fallback-smoke:
    # Exercises the new run-cargo-with-sccache-fallback action directly against a real `cargo
    # build`, plus an escape-hatch call that asserts argv (including an embedded-space argument)
    # survives the action's newline-delimited args -> argv plumbing intact.
    name: run-cargo-with-sccache-fallback action smoke test
    runs-on: arc-catfood-minimal
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Argument-heavy real cargo build through the wrapper
        uses: ./.github/actions/run-cargo-with-sccache-fallback
        with:
          working-directory: .github/smoke-fixtures/rust-coverage
          tee-output-path: build-report.txt
          args: |
            build
            -p
            rust-coverage-smoke-fixture
            --features
            extra

      - name: Verify the tee'd build report
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/smoke-fixtures/rust-coverage/build-report.txt
          echo "tee-output-path wrote a non-empty build report"

      - name: Argv preservation through the cargo-fallback-script escape hatch
        uses: ./.github/actions/run-cargo-with-sccache-fallback
        with:
          cargo-fallback-script: .github/smoke-fixtures/sccache-actions/argv-echo-check.sh
          args: |
            build
            -p
            rust-coverage-smoke-fixture
            --message
            hello world
            --features
            extra
