name: Cache cleanup engine

# Shared reusable engine for the weekly stale-GitHub-Actions-cache cleanup (mecha10, mecha10-api,
# mecha10-dashboard, mecha10-rl - verified byte-identical across all four, modulo a trailing
# comment on the cron line in mecha10-rl).
#
# A `workflow_call` workflow cannot own `schedule`/`workflow_dispatch` triggers, so each caller
# keeps a thin file with its own `on:` block invoking this one. See the PR description for the
# exact caller YAML all four repos should adopt.

on:
  workflow_call:

jobs:
  cleanup:
    name: Clean up stale caches
    runs-on: arc-catfood-minimal
    timeout-minutes: 20
    permissions:
      actions: write

    steps:
      - name: Delete stale GitHub Actions caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          echo "Fetching cache list..."
          CUTOFF=$(date -d '7 days ago' --iso-8601=seconds 2>/dev/null || date -v-7d +%Y-%m-%dT%H:%M:%S 2>/dev/null)
          echo "Deleting caches last accessed before: ${CUTOFF}"

          DELETED=0
          while IFS= read -r cache; do
            ID=$(echo "$cache" | jq -r '.id')
            KEY=$(echo "$cache" | jq -r '.key')
            LAST_ACCESSED=$(echo "$cache" | jq -r '.last_accessed_at')
            SIZE=$(echo "$cache" | jq -r '.size_in_bytes')

            if [[ "$LAST_ACCESSED" < "$CUTOFF" ]]; then
              echo "Deleting cache: ${KEY} (last accessed: ${LAST_ACCESSED}, size: ${SIZE} bytes)"
              gh api --method DELETE "/repos/${REPO}/actions/caches/${ID}" || true
              DELETED=$((DELETED + 1))
            fi
          done < <(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | @json')

          echo ""
          echo "Done. Deleted ${DELETED} stale cache(s)."

      - name: Show remaining caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          echo "Remaining caches:"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.key) | last accessed: \(.last_accessed_at) | \(.size_in_bytes) bytes"'
